<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logs | Cream's Macro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>body { padding: 8px; background: var(--bg-deep); }</style>
</head>
<body class="h-full w-full flex flex-col">
  <section class="rp-panel rp-panel-fill">
    <header class="rp-panel-head">
      <span class="rp-head-tag" style="--rp-tag: var(--brand);">Live</span>
      <span class="rp-head-title">Process Log</span>
      <span class="rp-head-rule"></span>
      <button onclick="clearLogs()" class="log-toolbar-btn text-[10px] font-semibold flex-shrink-0" style="color: var(--text-muted);" title="Clear logs">Clear</button>
    </header>
    <div id="log-list" class="rp-log-list overflow-y-auto font-mono font-medium text-[11px] p-2 space-y-0.5"
         style="color: var(--text-dim);">
    </div>
    <!-- Same jump-to-newest pill the dashboard log has -- this window is the
         one people actually leave open to watch a run, so following-only-
         while-at-the-bottom matters more here, not less. -->
    <button id="log-jump" class="log-jump" onclick="jumpLogToLatest()" title="Jump to the newest line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <span id="log-jump-count">0</span> new
    </button>
  </section>

  <!-- addLog/renderLogLine/the line cap/the scroll behaviour are shared with
       the dashboard (ui/index.html loads the same file). This page has no
       js_api of its own -- Python pushes lines straight into window.addLog
       via evaluate_js (see Api.push_log / Api.pop_out_logs in main.py). -->
  <script src="log_view.js"></script>
  <script>
    // Only the part that differs from the dashboard: there, Clear also tells
    // Python to drop its history buffer; here it just empties this view.
    function clearLogs() {
      clearLogView();
    }
  </script>
</body>
</html>
