name: macOS Asset Build

# Manually builds the macOS zip from CURRENT MAIN and attaches it to an
# existing release -- for when a tag's own macos job failed on something
# already fixed on main (a tag-triggered rerun would execute the workflow
# and build script AS OF THE TAG'S COMMIT, i.e. still broken -- the same
# reasoning behind discord-release-post.yml). First used for v0.4.0, whose
# tagged build script still had the Windows-only --add-data separator.
#
# Usage: Actions > macOS Asset Build > Run workflow > enter the tag, or
# `gh workflow run macos-asset.yml -f tag=v0.4.0`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the macOS zip to (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    # Match the tagged-release job: the downloadable app must contain an
    # x86_64 interpreter and native dependencies for Intel Macs.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pillow: build-time only -- converts logo.ico to the .icns the
          # .app bundle icon needs (see build_pyinstaller.py's _mac_icns_path).
          pip install pyinstaller pillow

      # Same signing-identity import as release.yml's build-macos job -- see
      # that file for the full "why". When the MACOS_CODESIGN_P12 secret is
      # present, import the stable self-signed cert so build_pyinstaller.py
      # signs with it non-interactively; otherwise this no-ops and the build
      # falls back to ad-hoc signing.
      - name: Import macOS code signing identity
        if: ${{ secrets.MACOS_CODESIGN_P12 != '' }}
        shell: bash
        env:
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Throwaway keychain in the workspace, not the login keychain, so
          # the imported private key never lingers past this runner.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # The secret holds the single-line base64 of the .p12 (see
          # tools/make_macos_codesign_cert.sh). openssl base64 -A/-d is used
          # instead of BSD base64(1)'s -D/-b so this stays portable.
          printf '%s' "$MACOS_CODESIGN_P12" | openssl base64 -d -A -out cert.p12
          # -T whitelists only codesign/security as apps allowed to use the
          # private key (the insecure alternative is -A, "any app").
          security import cert.p12 -k build.keychain -P "$MACOS_CODESIGN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # This partition-list update is what lets codesign use the private
          # key without a GUI unlock prompt on modern macOS -- do NOT skip it.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12
          # The identity is the cert common name (same CN baked into
          # tools/make_macos_codesign_cert.sh); build_pyinstaller.py reads
          # this env var and signs with it instead of ad-hoc.
          echo "MACOS_CODESIGN_IDENTITY=Creams Macro Code Signing" >> "$GITHUB_ENV"

      - name: Build app (PyInstaller)
        run: python build_pyinstaller.py

      - name: Verify Intel application binary
        run: file "dist/Creams Macro - Anime Expeditions.app/Contents/MacOS/Creams Macro - Anime Expeditions" | grep -q x86_64

      # Same packaging as release.yml's macos job -- see its comments.
      - name: Package macOS zip (.app + editable Assets folder)
        run: |
          mkdir -p package
          cp -R "dist/Creams Macro - Anime Expeditions.app" package/
          cp -R Assets package/Assets
          # No --keepParent: it wrapped everything in a "package/" folder, which both
          # made manual extraction awkward and silently broke the updater's Assets
          # merge on mac (it looked for Assets/ at the zip root). The updater still
          # tolerates old wrapped zips -- see core/updater.py.
          cd package && ditto -c -k --sequesterRsrc . ../dist/Creams-Macro-Anime-Expeditions-macOS.zip

      - name: Upload macOS asset to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/Creams-Macro-Anime-Expeditions-macOS.zip
