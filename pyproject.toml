[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = [
    "E501",   # line too long -- handled by formatter / existing style
    "F401",   # unused import -- many re-exports
    "F403",   # star import -- used for runner_constants
    "F405",   # may be undefined from star import
    "E722",   # bare except
    "E402",   # module-level import not at top
    "E741",   # ambiguous variable name
    "E731",   # lambda assignment
    "SIM108", # ternary -- many multi-line ifs are clearer as-is
    "UP015",  # redundant open mode -- explicit "r" is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

